{% extends "base.html" %}

{% block title %}Login - CineBook{% endblock %}

{% block content %}
<div class="auth-box">
    <div class="auth-header">
        <span style="font-size: 2.2rem;">🎬</span>
        <h2>Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to book tickets and manage reservations</p>
    </div>

    <!-- Demo Credentials Quick-Fill helper for college viva presentation -->
    <div class="demo-credentials-box">
        <strong style="color: var(--cyan-accent); display: block; margin-bottom: 0.3rem;">⚡ College Demo Quick-Fill:</strong>
        <p>Click below to prefill demo accounts:</p>
        <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoCredentials('user@cinebook.com', 'user123')">
                👤 Demo User
            </button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoCredentials('admin@cinebook.com', 'admin123')">
                👑 Demo Admin
            </button>
        </div>
    </div>

    <div id="login-error" class="alert alert-danger" style="display: none;"></div>

    <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
            Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register" style="color: var(--accent-primary); font-weight: 600;">Sign up</a>
    </div>
</div>
{% endblock %}
