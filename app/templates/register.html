{% extends "base.html" %}

{% block title %}Create an Account - CineBook{% endblock %}

{% block content %}
<div class="auth-box">
    <div class="auth-header">
        <span style="font-size: 2.2rem;">🎟️</span>
        <h2>Create Account</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Join CineBook to discover movies & live events</p>
    </div>

    <div id="register-error" class="alert alert-danger" style="display: none;"></div>

    <form onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-input" placeholder="Gayatri Sharma" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="gayatri@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="phone">Phone Number (Optional)</label>
            <input type="tel" id="phone" class="form-input" placeholder="+91 98765 43210">
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password (min 6 chars)</label>
            <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" class="form-input" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
            Create Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login" style="color: var(--accent-primary); font-weight: 600;">Sign in</a>
    </div>
</div>
{% endblock %}
